<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Twin Maturity Assessment Tool for Net Zero Carbon Buildings</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ── Reset ── */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0B2C40;--green:#1D9E75;--teal:#0F6E56;--teal-l:#E1F5EE;--teal-d:#04342C;
  --blue:#185FA5;--blue-l:#E6F1FB;--blue-d:#042C53;
  --amber:#BA7517;--amber-l:#FAEEDA;--amber-d:#412402;
  --purple:#534AB7;--purple-l:#EEEDFE;--purple-d:#26215C;
  --red:#E24B4A;--red-l:#FCEBEB;
  --border:#E5E7EB;--border2:#D1D5DB;
  --text:#111827;--text2:#6B7280;--text3:#9CA3AF;
  --bg:#FFFFFF;--bg2:#F9FAFB;--bg3:#F3F4F6;
  --sh:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.05);
  --shl:0 8px 24px rgba(0,0,0,.09);
  --r:8px;--rl:12px;
}
@media(prefers-color-scheme:dark){
  :root{--border:#374151;--border2:#4B5563;--text:#F9FAFB;--text2:#9CA3AF;--text3:#6B7280;
        --bg:#111827;--bg2:#1F2937;--bg3:#374151;--sh:0 1px 3px rgba(0,0,0,.3)}
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;color:var(--text);background:var(--bg3);min-height:100vh}

/* ── Top bar ── */
.topbar{background:var(--navy);position:sticky;top:0;z-index:100}
.tbi{max-width:820px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:12px}
.tl{width:34px;height:34px;background:var(--green);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.tt{font-size:13px;font-weight:700;color:#fff;line-height:1.3}
.ts{font-size:11px;color:rgba(255,255,255,.5);margin-top:1px}
.tr{margin-left:auto;font-size:11px;color:rgba(255,255,255,.45);text-align:right;white-space:nowrap}
.pb{height:3px;background:rgba(255,255,255,.1)}
.pf{height:3px;background:var(--green);transition:width .55s}

/* ── Shell & animation ── */
.shell{max-width:820px;margin:0 auto;padding:22px 16px 64px}
.sc{animation:fi .27s ease}
@keyframes fi{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* ── Card ── */
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--rl);padding:22px 24px;margin-bottom:14px;box-shadow:var(--sh)}
.card-sm{padding:16px 18px}
.ct{font-size:17px;font-weight:700;margin-bottom:4px}
.cs{font-size:13px;color:var(--text2);line-height:1.65}

/* ── Hero ── */
.hero{text-align:center;padding:40px 24px 30px}
.hb{display:inline-flex;align-items:center;gap:6px;background:var(--teal-l);color:var(--teal-d);border-radius:20px;padding:5px 15px;font-size:12px;font-weight:700;margin-bottom:16px;border:1px solid rgba(15,110,86,.15)}
.ht{font-size:26px;font-weight:800;line-height:1.3;margin-bottom:12px;color:var(--navy)}
@media(prefers-color-scheme:dark){.ht{color:#F9FAFB}}
.hd{font-size:14px;color:var(--text2);max-width:560px;margin:0 auto 24px;line-height:1.8}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
.chip{padding:5px 13px;border-radius:20px;font-size:11px;font-weight:600;background:var(--bg2);border:1px solid var(--border);color:var(--text2)}

/* ── MD overview grid ── */
.mdg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
@media(max-width:580px){.mdg{grid-template-columns:1fr}}
.mdc{padding:16px;border-radius:var(--rl);border:1px solid;transition:transform .15s;cursor:default}
.mdc:hover{transform:translateY(-2px);box-shadow:var(--shl)}
.mdn{font-size:13px;font-weight:700;margin-bottom:8px}
.sdl{display:flex;flex-direction:column;gap:4px}
.sdi{font-size:11px;padding:3px 0 3px 8px;border-left:2px solid;line-height:1.35}

/* ── Video section ── */
.vid-wrap{position:relative;width:100%;padding-bottom:56.25%;border-radius:var(--r);overflow:hidden;background:#000;margin-bottom:14px}
.vid-wrap iframe,.vid-wrap video{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid-wrap video{object-fit:contain;background:#000}
.vid-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy) 0%,#1a4a6b 100%);cursor:pointer;transition:background .2s}
.vid-placeholder:hover{background:linear-gradient(135deg,#0d2233 0%,#123956 100%)}
.vid-play{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;margin-bottom:14px;transition:all .2s}
.vid-placeholder:hover .vid-play{background:var(--green);border-color:var(--green);transform:scale(1.07)}
.vid-triangle{width:0;height:0;border-style:solid;border-width:12px 0 12px 22px;border-color:transparent transparent transparent #fff;margin-left:4px}
.vid-label{font-size:15px;font-weight:700;color:#fff;margin-bottom:6px}
.vid-sub{font-size:12px;color:rgba(255,255,255,.55)}
.step-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.step-pill{display:flex;align-items:center;gap:6px;padding:7px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;font-size:12px;color:var(--text2)}
.step-pill-num{width:20px;height:20px;border-radius:50%;background:var(--green);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ── Question block — matches image style ── */
.q-block{margin-bottom:28px}
.q-label{
  display:block;
  font-size:12px;
  font-weight:800;
  color:var(--text);
  letter-spacing:.04em;
  text-transform:uppercase;
  line-height:1.5;
  margin-bottom:10px;
}
.q-input{
  display:block;
  width:100%;
  padding:11px 14px;
  border:1px solid var(--border2);
  border-radius:var(--r);
  font-size:14px;
  color:var(--text);
  background:var(--bg);
  appearance:auto;
  outline:none;
  font-family:inherit;
}
.q-input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(29,158,117,.12)}

/* ── Informed continuation gate ── */
.consent-gate{border:1px solid var(--border2);border-radius:var(--rl);margin:0 0 28px;padding:18px;background:var(--bg2)}
.consent-gate legend{padding:0 7px;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--teal-d)}
.consent-question{font-size:15px;font-weight:750;line-height:1.5;color:var(--text);margin:0 0 5px}
.consent-help{font-size:12px;line-height:1.55;color:var(--text3);margin:0 0 14px}
.consent-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.consent-choice{display:flex;align-items:flex-start;gap:10px;border:1.5px solid var(--border2);border-radius:var(--r);background:var(--bg);cursor:pointer;padding:13px 14px;transition:border-color .15s,background .15s,box-shadow .15s}
.consent-choice:hover{border-color:var(--green);background:var(--teal-l)}
.consent-choice:focus-within{border-color:var(--green);box-shadow:0 0 0 3px rgba(29,158,117,.12)}
.consent-choice-selected{border-color:var(--green);background:var(--teal-l)}
.consent-choice input{accent-color:var(--green);flex:0 0 auto;margin:2px 0 0;width:17px;height:17px}
.consent-choice strong{display:block;font-size:13px;line-height:1.4;color:var(--text)}
.consent-choice span{display:block;font-size:11px;line-height:1.45;color:var(--text3);margin-top:2px}
.consent-outcome{border-radius:var(--r);font-size:13px;line-height:1.6;margin-bottom:28px;padding:14px 16px}
.consent-declined{background:var(--bg2);border:1px solid var(--border2);color:var(--text2)}
.demographic-fields{animation:fi .22s ease}
.demographic-heading{font-size:15px;font-weight:800;margin:0 0 20px;outline:none}
@media(max-width:580px){.consent-options{grid-template-columns:1fr}}

/* ── Radio list for Q5 & Q6 ── */
.q-radio-list{display:flex;flex-direction:column;gap:10px}
.q-radio-row{
  display:flex;align-items:center;gap:12px;
  padding:11px 14px;
  border:1px solid var(--border2);
  border-radius:var(--r);
  cursor:pointer;
  background:var(--bg);
  transition:border-color .12s,background .12s;
}
.q-radio-row input[type=radio]{position:absolute;opacity:0;width:0;height:0}
.q-radio-row:hover{border-color:var(--green);background:var(--teal-l)}
.q-radio-checked{border-color:var(--green);background:var(--teal-l)}
.q-radio-circle{
  width:18px;height:18px;border-radius:50%;
  border:2px solid var(--border2);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .12s;
}
.q-radio-checked .q-radio-circle{border-color:var(--green)}
.q-radio-checked .q-radio-circle::after{
  content:'';width:8px;height:8px;border-radius:50%;background:var(--green);display:block;
}
.q-radio-label{font-size:14px;color:var(--text);font-weight:500}

/* ── Assessment dimension header ── */
.mdh{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.mddot{width:14px;height:14px;border-radius:50%;flex-shrink:0;margin-top:4px}
.mdco{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.mdtl{font-size:19px;font-weight:800;line-height:1.25}

/* ── SD block ── */
.sdb{border:1px solid var(--border);border-radius:var(--rl);padding:20px;margin-bottom:14px;background:var(--bg);transition:border-color .2s,box-shadow .2s}
.sdb.ok-cur{border-left:4px solid var(--green)}
.sdb.ok-both{border:1px solid var(--green);box-shadow:0 0 0 1px rgba(29,158,117,.15)}
.sdt{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px}
.sdco{font-size:10px;font-weight:800;color:var(--text3);background:var(--bg2);border-radius:5px;padding:3px 7px;flex-shrink:0;margin-top:2px}
.sdna{font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px}
.bds{display:flex;gap:6px;flex-wrap:wrap}
.bc{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.bcc{background:rgba(24,95,165,.12);color:var(--blue)}
.bce{background:rgba(186,117,23,.12);color:var(--amber)}

/* ── Dual scoring panels ── */
.dual-panel{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.dual-panel{grid-template-columns:1fr}}
.score-panel{border:1px solid var(--border2);border-radius:var(--r);padding:14px;background:var(--bg2)}
.score-panel.panel-cur{border-top:3px solid var(--green)}
.score-panel.panel-tgt{border-top:3px solid var(--blue)}
.panel-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.panel-label-cur{color:var(--teal)}
.panel-label-tgt{color:var(--blue)}
.panel-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-cur{background:var(--green)}
.dot-tgt{background:var(--blue)}

/* ── Level buttons ── */
.lvg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:10px}
.lvb{padding:7px 3px;border:1px solid var(--border2);border-radius:6px;background:var(--bg);cursor:pointer;text-align:center;transition:all .12s}
.lvb .ln{font-size:13px;font-weight:800;display:block}
.lvb .ll{font-size:8px;font-weight:600;display:block;opacity:.6;margin-top:1px}
/* Current buttons */
.lvb-cur .ln{color:var(--text2)}
.lvb-cur .ll{color:var(--text2)}
.lvb-cur:hover{border-color:var(--green);background:var(--teal-l)}
.lvb-cur:hover .ln,.lvb-cur:hover .ll{color:var(--teal-d)}
.lvb-cur.on{background:var(--green);border-color:var(--green);box-shadow:0 2px 8px rgba(29,158,117,.3)}
.lvb-cur.on .ln,.lvb-cur.on .ll{color:#fff}
/* Target buttons */
.lvb-tgt .ln{color:var(--text2)}
.lvb-tgt .ll{color:var(--text2)}
.lvb-tgt:hover{border-color:var(--blue);background:var(--blue-l)}
.lvb-tgt:hover .ln,.lvb-tgt:hover .ll{color:var(--blue-d)}
.lvb-tgt.on{background:var(--blue);border-color:var(--blue);box-shadow:0 2px 8px rgba(24,95,165,.25)}
.lvb-tgt.on .ln,.lvb-tgt.on .ll{color:#fff}

/* ── Level descriptor ── */
.lvd{background:var(--bg);border-radius:var(--r);padding:10px 13px;font-size:12px;color:var(--text2);line-height:1.7;min-height:54px;border-left:3px solid transparent}
.lvd-cur.on{border-left-color:var(--green)}
.lvd-tgt.on{border-left-color:var(--blue)}
.lvdh-cur{font-size:10px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.lvdh-tgt{font-size:10px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}

/* ── Gap indicator in SD block ── */
.gap-row{display:flex;align-items:center;gap:8px;margin-top:12px;padding:8px 12px;background:var(--bg3);border-radius:var(--r);font-size:12px}
.gap-label{color:var(--text2);font-weight:600}
.gap-val{font-weight:800}
.gap-pos{color:var(--blue)}
.gap-zero{color:var(--green)}
.gap-neg{color:var(--red)}

/* ── Note ── */
.note{font-size:11px;color:var(--text3);background:var(--bg2);border-radius:var(--r);padding:8px 12px;margin-top:8px;line-height:1.5}

/* ── Nav ── */
.nav{display:flex;align-items:center;justify-content:space-between;margin-top:20px;gap:12px}
.btn{padding:10px 22px;border-radius:var(--r);font-size:14px;font-weight:700;cursor:pointer;border:none;transition:all .15s}
.btn:disabled{cursor:not-allowed;opacity:.45;transform:none;box-shadow:none}
.btn-p{background:var(--green);color:#fff}
.btn-p:hover{background:var(--teal);transform:translateY(-1px);box-shadow:0 5px 14px rgba(29,158,117,.3)}
.btn-p:disabled:hover{background:var(--green);transform:none;box-shadow:none}
.btn-s{background:var(--bg);color:var(--text);border:1px solid var(--border2)}
.btn-s:hover{background:var(--bg2)}
.btn-o{background:transparent;color:var(--green);border:1px solid var(--green)}
.btn-o:hover{background:var(--teal-l)}
.si{font-size:12px;color:var(--text3);font-weight:600}
.warn{font-size:12px;color:var(--amber-d);background:var(--amber-l);border:1px solid rgba(186,117,23,.3);border-radius:var(--r);padding:10px 14px;text-align:center;margin-top:10px}

/* ── Results ── */
.rh{text-align:center;padding:32px 24px 24px}
.score-pair{display:flex;justify-content:center;gap:24px;margin-bottom:16px;flex-wrap:wrap}
.sr{width:130px;height:130px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:6px solid}
.sv{font-size:38px;font-weight:800;line-height:1}
.sd-sub{font-size:13px;color:var(--text2);font-weight:400}
.sr-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;display:flex;align-items:center;gap:5px;justify-content:center}
.bp{display:inline-block;padding:5px 18px;border-radius:20px;font-size:13px;font-weight:800;margin-top:4px}
.ro{font-size:13px;color:var(--text2);margin-top:8px}

/* ── MD result grid ── */
.mrg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
@media(max-width:580px){.mrg{grid-template-columns:1fr}}
.mrc{padding:14px;border-radius:var(--rl);border:1px solid;text-align:center}
.mri{font-size:20px;margin-bottom:5px}
.mrl{font-size:11px;font-weight:700;margin-bottom:8px;line-height:1.3}
.mrc-scores{display:flex;justify-content:center;gap:12px}
.mrc-score{text-align:center}
.mrc-sv{font-size:22px;font-weight:800;line-height:1}
.mrc-sl{font-size:9px;font-weight:600;margin-top:2px;opacity:.65}

/* ── SD dual bars in results ── */
.bg{margin-bottom:18px}
.bgt{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:9px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.br{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brl{width:195px;flex-shrink:0;font-size:12px;color:var(--text2);line-height:1.3}
.brc{font-size:10px;font-weight:700;color:var(--text3);margin-right:4px}
.brt{flex:1;height:7px;background:var(--bg3);border-radius:4px;overflow:hidden;position:relative}
.brf{height:100%;border-radius:4px;transition:width 1.3s cubic-bezier(.16,1,.3,1)}
.brv{width:30px;font-size:11px;font-weight:700;text-align:right}
.gap-tag{font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;min-width:36px;text-align:center}
.gap-tag-pos{background:var(--blue-l);color:var(--blue-d)}
.gap-tag-zero{background:var(--teal-l);color:var(--teal-d)}
.gap-tag-neg{background:var(--red-l);color:#501313}

/* ── Priority ── */
/* ── Two-parts box on welcome page ── */
.parts-box{border:1.5px solid var(--green);border-radius:var(--rl);background:var(--teal-l);padding:18px 20px;max-width:600px;margin:0 auto 24px}
.parts-title{font-size:13px;font-weight:800;color:var(--teal-d);margin-bottom:14px;text-align:center}
.parts-row{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap}
.part-item{display:flex;align-items:flex-start;gap:10px;text-align:left;flex:1;min-width:190px}
.part-num{width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.part-name{font-size:13px;font-weight:700;color:var(--teal-d);line-height:1.3}
.part-meta{font-size:11px;color:var(--teal-d);opacity:.75;margin-top:3px;line-height:1.45}
.part-arrow{font-size:18px;color:var(--green);font-weight:300;flex-shrink:0}
.parts-note{font-size:11px;color:var(--teal-d);opacity:.7;text-align:center;margin-top:14px;font-style:italic}
@media(max-width:520px){.part-arrow{display:none}}

/* ── Part 2 prompt card ── */
.next-part{text-align:center;padding:28px 24px;border:2px solid var(--green);background:linear-gradient(180deg,var(--teal-l) 0%,var(--bg) 100%)}
.next-badge{display:inline-block;background:var(--green);color:#fff;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 14px;border-radius:20px}
.next-title{font-size:18px;font-weight:800;color:var(--teal-d);margin:12px 0 8px}
.next-desc{font-size:13px;color:var(--text2);line-height:1.75;max-width:520px;margin:0 auto 18px}
@media(prefers-color-scheme:dark){.next-title{color:var(--green)}}

/* ── Strategy cards (aggregated strategies by sub-dimension) ── */
.strat-card{padding:18px 20px}
.strat-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.strat-rank{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0;margin-top:1px}
.strat-title{font-size:14px;font-weight:700;color:var(--text);line-height:1.35}
.strat-sub{font-size:11px;color:var(--text3);margin-top:2px}
.strat-gap{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.strat-states{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.strat-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.strat-list{list-style:none;margin:0;padding:0}
.strat-item{display:flex;gap:10px;font-size:13px;line-height:1.6;color:var(--text2);padding:7px 0;border-bottom:1px solid var(--border)}
.strat-item:last-child{border-bottom:none}
.strat-id{font-weight:700;font-size:12px;flex-shrink:0;min-width:38px}
.strat-extra{font-style:italic;color:var(--text3)}
.pi{display:flex;gap:12px;padding:14px;border:1px solid var(--border);border-radius:var(--rl);margin-bottom:9px;align-items:flex-start;background:var(--bg)}
.pn{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0;margin-top:1px}
.pna{font-size:13px;font-weight:700;margin-bottom:2px}
.pm{font-size:11px;color:var(--text3);margin-bottom:6px}
.pi-scores{display:flex;gap:12px;margin-bottom:6px}
.pi-score{font-size:12px;font-weight:600;padding:2px 10px;border-radius:8px}
.pi-cur-s{background:var(--teal-l);color:var(--teal-d)}
.pi-tgt-s{background:var(--blue-l);color:var(--blue-d)}
.pi-gap-s{background:var(--amber-l);color:var(--amber-d)}
.pc{font-size:12px;color:var(--text2);margin-bottom:3px;line-height:1.5}
.px{font-size:12px;color:var(--blue);font-weight:600;line-height:1.5}

/* ── Maturity scale ── */
.ms{display:flex;border-radius:var(--r);overflow:hidden;margin:12px 0 6px}
.msc{flex:1;padding:9px 4px;text-align:center}
.msn{font-size:12px;font-weight:800}
.msl{font-size:9px;font-weight:600;margin-top:2px}
.msr{font-size:8px;margin-top:1px;opacity:.55}

/* ── Rec ── */
.rec{border-radius:var(--rl);padding:16px 18px;margin-bottom:10px;border:1px solid}
.ret{font-size:14px;font-weight:700;margin-bottom:5px}
.reb{font-size:13px;line-height:1.7}

/* ── Disclaimer ── */
.disc{font-size:12px;color:var(--text3);text-align:center;line-height:1.65;padding:16px 18px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg2);margin-top:4px}

/* ── Legend ── */
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.leg-item{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.leg-dot{width:10px;height:10px;border-radius:2px}

/* ── Tab navigation ── */
.tab-bar{background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:56px;z-index:90}
.tab-bar-inner{max-width:820px;margin:0 auto;padding:0 16px;display:flex;gap:0}
.tab-btn{padding:13px 20px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;border:none;background:transparent;border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap}
.tab-btn:hover{color:var(--text);background:var(--bg2)}
.tab-btn.tab-active{color:var(--green);border-bottom-color:var(--green);background:transparent}
.tab-badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700;background:var(--teal-l);color:var(--teal-d);margin-left:6px}

/* ── Expert survey ── */
.likert-group{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.likert-q{border:1px solid var(--border);border-radius:var(--rl);padding:16px;background:var(--bg)}
.likert-q.answered{border-left:4px solid var(--green)}
.likert-text{font-size:13px;font-weight:600;color:var(--text);margin-bottom:12px;line-height:1.5}
.likert-scale{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.likert-opt{padding:8px 4px;border:1.5px solid var(--border2);border-radius:8px;background:var(--bg2);cursor:pointer;text-align:center;transition:all .12s;display:flex;flex-direction:column;align-items:center;gap:3px}
.likert-opt:hover{border-color:var(--green);background:var(--teal-l)}
.likert-opt.lk-on{background:var(--green);border-color:var(--green);box-shadow:0 2px 8px rgba(29,158,117,.25)}
.likert-opt .lk-num{font-size:15px;font-weight:800;color:var(--text2)}
.likert-opt .lk-lbl{font-size:9px;font-weight:600;color:var(--text3);line-height:1.2}
.likert-opt.lk-on .lk-num,.likert-opt.lk-on .lk-lbl{color:#fff}
.lk-anchor{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-top:5px;padding:0 2px}
.open-q{margin-top:10px}
.open-q label{font-size:13px;font-weight:600;color:var(--text);display:block;margin-bottom:8px;line-height:1.5}
.open-ta{width:100%;padding:10px 13px;border:1px solid var(--border2);border-radius:var(--r);font-size:13px;font-family:inherit;color:var(--text);background:var(--bg);resize:vertical;min-height:90px;outline:none;line-height:1.6}
.open-ta:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(29,158,117,.12)}
.survey-submitted{text-align:center;padding:48px 24px}
.survey-tick{width:64px;height:64px;border-radius:50%;background:var(--teal-l);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px}
.progress-survey{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin:10px 0 4px}
.progress-survey-fill{height:100%;background:var(--green);border-radius:3px;transition:width .4s}
.radio-group{display:flex;flex-direction:column;gap:8px}
.radio-group-size{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:540px){.radio-group-size{grid-template-columns:1fr 1fr}}
.radio-card{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1.5px solid var(--border2);border-radius:var(--rl);background:var(--bg);cursor:pointer;transition:all .15s;user-select:none}
.radio-card:hover{border-color:var(--green);background:var(--teal-l)}
.radio-selected{border-color:var(--green)!important;background:var(--teal-l)!important;box-shadow:0 0 0 1px rgba(29,158,117,.2)}
.radio-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border2);flex-shrink:0;margin-top:1px;transition:all .15s;position:relative}
.radio-selected .radio-dot{border-color:var(--green);background:var(--green)}
.radio-selected .radio-dot::after{content:'';position:absolute;inset:3px;border-radius:50%;background:#fff}
.radio-text{font-size:13px;font-weight:600;color:var(--text);display:block;line-height:1.3}
.radio-sub{font-size:11px;color:var(--text3);display:block;margin-top:2px}
.size-card{flex-direction:column;align-items:center;text-align:center;padding:14px 10px;gap:6px}
.size-card .radio-dot{margin:0}

@media print{.topbar,.nav{display:none!important}.card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}body{background:#fff;font-size:12px}}
</style>

// ── COMPUTE — DEMATEL global-weight scoring (per Yifei Sheng weight model) ──
//   Sub-dimension contribution  =  (cl / 5) × GW           [Eq. 3 scaling]
//   Dimension score  =  Σ contributions in that dimension
//   Overall score    =  Σ all 9 contributions   (max = ΣGW = 1.000)
//   Scores are on a 0–1 scale and map to five maturity bands (see band()).
function calc() {
  const curMD={}, tgtMD={};           // dimension-level summed contributions
  const curMDpct={}, tgtMDpct={};     // dimension score normalised 0–1 within dimension
  let curTot=0, tgtTot=0;             // overall 0–1 score
  M.mds.forEach(md => {
    let cS=0, tS=0, gwSum=0;
    md.sds.forEach(sd => {
      const c = S.sc[sd.id].cur || 1;
      const t = S.sc[sd.id].tgt || 1;
      cS    += (c / 5) * sd.gw;       // (cl / L) × GW
      tS    += (t / 5) * sd.gw;
      gwSum += sd.gw;                 // sum of global weights within this dimension
    });
    curMD[md.id]=cS; tgtMD[md.id]=tS;
    curMDpct[md.id] = gwSum>0 ? cS/gwSum : 0;   // normalise dimension to 0–1
    tgtMDpct[md.id] = gwSum>0 ? tS/gwSum : 0;
    curTot += cS;                     // overall = simple sum of contributions
    tgtTot += tS;
  });
  return {curMD, tgtMD, curMDpct, tgtMDpct, curTot, tgtTot};
}

// ── BAND — maps a 0–1 score to one of five maturity levels (PPT scale) ─────
//   L1: 0.00–0.20  L2: 0.21–0.40  L3: 0.41–0.60  L4: 0.61–0.80  L5: 0.81–1.00
function band(s) {
  if(s<=0.20)return{l:'Non-existent',n:1,c:'#E24B4A',bg:'#FCEBEB',tc:'#501313',
    tip:'No meaningful digital twin capability present. Foundational infrastructure and commitment must be urgently established.'};
  if(s<=0.40)return{l:'Emerging',n:2,c:'#BA7517',bg:'#FAEEDA',tc:'#412402',
    tip:'Initial steps are in place but significant investment across all three dimensions is required before DT-enabled net zero management is achievable.'};
  if(s<=0.60)return{l:'Developing',n:3,c:'#3B6D11',bg:'#EAF3DE',tc:'#173404',
    tip:'Systematic approaches are being established. Targeted investment in weaker sub-dimensions will accelerate the path towards an integrated digital twin.'};
  if(s<=0.80)return{l:'Advanced',n:4,c:'#185FA5',bg:'#E6F1FB',tc:'#042C53',
    tip:'Strong digital twin capability is demonstrated. The organisation is proactively managing towards net zero using robust data-driven approaches.'};
  return       {l:'Optimising',n:5,c:'#534AB7',bg:'#EEEDFE',tc:'#26215C',
    tip:'Industry-leading integrated digital twin operation. Net zero performance is verified and the organisation actively contributes to sector standards and policy.'};
}

function saveI() {

  S.info.exp      = document.getElementById('fe')?.value.trim()  || '';

function setConsent(val) {
  if (val === 'no') {
    S.info = {consent:'no', org:'', exp:'', role:'', country:'', edu:'', eduOther:'', size:''};
  } else {
    S.info.consent = 'yes';
  }
  render();
  requestAnimationFrame(() => {

  });
}
function pickEdu(val) {
  S.info.edu = val;
  document.querySelectorAll('[name="edu"]').forEach(r => {
    r.closest('.q-radio-row')?.classList.toggle('q-radio-checked', r.value === val);
  });

  if (wrap) wrap.style.display = val === 'Other' ? 'block' : 'none';
}
function pickSize(val) {
  S.info.size = val;
  document.querySelectorAll('[name="size"]').forEach(r => {
    r.closest('.q-radio-row')?.classList.toggle('q-radio-checked', r.value === val);
  });
}
function setS(id, type, lv) {
  S.sc[id][type] = lv;
  // Update buttons for this type
  document.querySelectorAll(`[data-id="${id}"][data-type="${type}"]`)
          .forEach(b => b.classList.toggle('on', +b.dataset.lv === lv));
  // Update descriptor
  const el = document.getElementById(type==='cur'?`dc_${id}`:`dt_${id}`);
  if (el) {
    const sd = ALL.find(x => x.id === id);
    if (sd) {
      el.classList.add('on');
      const hClass = type==='cur'?'lvdh-cur':'lvdh-tgt';
      el.innerHTML = `<div class="${hClass}">Level ${lv} — ${LVL[lv-1]}</div>${sd.levels[lv-1]}`;
    }
  }
  // Update block border
  const blk = document.getElementById('b_'+id);
  if (blk) {
    const c = S.sc[id].cur, t = S.sc[id].tgt;
    blk.classList.toggle('ok-both', c>0 && t>0);
    blk.classList.toggle('ok-cur',  c>0 && !(c>0 && t>0));
  }
  // Update gap row without full re-render
  const gapEl = blk?.querySelector('.gap-row');
  const c2 = S.sc[id].cur, t2 = S.sc[id].tgt;
  if (c2 > 0 && t2 > 0) {
    const gap = t2 - c2;
    const cls = gap>0?'gap-pos':gap===0?'gap-zero':'gap-neg';
    const txt = `${gap>0?'+':''}${gap} level${Math.abs(gap)===1?'':'s'} ${gap>0?'— improvement targeted':gap===0?'— target equals current':'— target is below current (please review)'}`;
    if (gapEl) { gapEl.querySelector('.gap-val').className=`gap-val ${cls}`; gapEl.querySelector('.gap-val').textContent=txt; }
    else {
      const div=document.createElement('div'); div.className='gap-row';
      div.innerHTML=`<span class="gap-label">Maturity gap:</span><span class="gap-val ${cls}">${txt}</span>`;
      blk.appendChild(div);
    }
  }

  // Keep navigation locked until every current and target score is complete.
  const activeMd = M.mds[S.idx];
  const mdComplete = activeMd.sds.every(sd => S.sc[sd.id].cur > 0 && S.sc[sd.id].tgt > 0);
  const nextBtn = document.getElementById('next-md-btn');
  if (nextBtn) {
    nextBtn.disabled = !mdComplete;
    nextBtn.setAttribute('aria-disabled', String(!mdComplete));
  }
  const warn = document.getElementById('md-warn');
  if (warn) warn.style.display = mdComplete ? 'none' : 'block';
}
function nextM() {
  const activeMd = M.mds[S.idx];
  const mdComplete = activeMd.sds.every(sd => S.sc[sd.id].cur > 0 && S.sc[sd.id].tgt > 0);
  if (!mdComplete) return;
  if (S.idx < M.mds.length-1) { S.idx++; render(); window.scrollTo({top:0,behavior:'smooth'}); }
  else go('results');
}
function prevM() {
  if (S.idx > 0) { S.idx--; render(); window.scrollTo({top:0,behavior:'smooth'}); }
}
function restart() {
  ALL.forEach(sd => { S.sc[sd.id] = {cur:0, tgt:0}; });
  S.info = {consent:'', org:'', exp:'', role:'', country:'', edu:'', eduOther:'', size:''};
  if (S.chart) { S.chart.destroy(); S.chart = null; }
  go('welcome');
}

//  EMAIL SUBMISSION — sends all respondent data to the researcher
// ═══════════════════════════════════════════════════════════════════════════
// Data is delivered to RESEARCHER_EMAIL via the FormSubmit relay service.
// SETUP (one time only): the FIRST submission sent to this address triggers a
// confirmation email from FormSubmit — click the activation link inside it and
// every submission thereafter arrives automatically with no further action.
// ── WHERE RESPONSES GO ─────────────────────────────────────────────────────
// RESEARCHER_EMAIL is the address shown to respondents and used by the
// "Email my responses" fallback button.
const RESEARCHER_EMAIL = 'yifei.sheng@postgrad.manchester.ac.uk';

// DELIVERY_EMAIL is the address FormSubmit actually delivers to. Set this to a
// personal address (Gmail/Outlook) if your university filter blocks the
// FormSubmit activation email — then forward or filter the results yourself.
// Leave it identical to RESEARCHER_EMAIL to send straight to the university.
const DELIVERY_EMAIL   = 'yifei.sheng@postgrad.manchester.ac.uk';

const FORM_ENDPOINT    = 'https://formsubmit.co/ajax/' + DELIVERY_EMAIL;

// If automatic delivery fails, respondents are offered manual options on the
// results screen. Set to true only if you also want a file saved to their
// Downloads folder automatically.
const AUTO_DOWNLOAD_ON_FAILURE = false;

const SUBMISSION_TIMEOUT_MS = 15000;
const SUB = { sent:false, sending:false, ok:false, error:'', acceptedAt:'' };

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  })[ch]);
}

// Confirm that the relay accepted the payload. This does not claim that the
// resulting email has already reached the researcher's inbox.
async function submitToRelay(payload) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), SUBMISSION_TIMEOUT_MS);
  try {
    const res = await fetch(FORM_ENDPOINT, {
      method : 'POST',
      headers: { 'Content-Type':'application/json', 'Accept':'application/json' },
      body   : JSON.stringify(payload),
      signal : controller.signal,
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    // FormSubmit may return HTTP 200 for a logical failure, so inspect its body.
    const data = await res.json().catch(() => ({}));
    if (String(data.success) === 'false') {
      const msg = data.message || 'Submission rejected';
      if (/web server|HTML files/i.test(msg)) {
        throw new Error('The tool must be opened from a website address, not a local file');
      }
      if (/[Aa]ctivation|[Aa]ctivate/.test(msg)) {
        throw new Error('The form is awaiting one-time activation by the research team');
      }
      throw new Error(msg);
    }
    return data;
  } catch (e) {
    if (e?.name === 'AbortError') {
      throw new Error('No confirmation was received within 15 seconds');
    }
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

// Build a structured + human-readable record of everything the expert entered
function buildSubmission() {
  const { curMD, tgtMD, curMDpct, tgtMDpct, curTot, tgtTot } = calc();
  const bc = band(curTot), bt = band(tgtTot);

  // ── Respondent details ──
  const details = {
    'Happy to continue'  : S.info.consent === 'yes' ? 'Yes' : 'No',
    'Organisation type'  : S.info.org      || '(not provided)',
    'Years of experience': S.info.exp      || '(not provided)',
    'Professional role'  : S.info.role     || '(not provided)',
    'Country of work'    : S.info.country  || '(not provided)',
    'Highest education'  : (S.info.edu === 'Other' && S.info.eduOther)
                             ? `Other — ${S.info.eduOther}`
                             : (S.info.edu || '(not provided)'),
    'Company size'       : S.info.size     || '(not provided)',
  };

  // ── Per sub-dimension scores ──
  const rows = ALL.map(sd => ({
    code        : sd.id,
    dimension   : sd.md.name,
    subDimension: sd.name,
    current     : S.sc[sd.id].cur || 0,
    target      : S.sc[sd.id].tgt || 0,
    gap         : (S.sc[sd.id].tgt || 0) - (S.sc[sd.id].cur || 0),
    globalWeight: sd.gw,
    contribution: +(((S.sc[sd.id].cur || 1) / 5) * sd.gw).toFixed(4),
  }));

  // ── Readable plain-text body ──
  const L = [];
  L.push('DIGITAL TWIN MATURITY ASSESSMENT — SUBMITTED RESPONSE');
  L.push('Digital Twin Maturity Assessment Tool for Net Zero Carbon Buildings');
  L.push('Submitted: ' + new Date().toLocaleString('en-GB'));
  L.push('');
  L.push('──────────────────────────────────────────────');
  L.push('1. ORGANISATION & RESPONDENT DETAILS');
  L.push('──────────────────────────────────────────────');
  Object.entries(details).forEach(([k, v]) => L.push(`${k}: ${v}`));
  L.push('');
  L.push('──────────────────────────────────────────────');
  L.push('2. OVERALL MATURITY SCORES');
  L.push('──────────────────────────────────────────────');
  L.push(`Current overall score: ${curTot.toFixed(3)} / 1.000  →  Level ${bc.n} (${bc.l})`);
  L.push(`Target  overall score: ${tgtTot.toFixed(3)} / 1.000  →  Level ${bt.n} (${bt.l})`);
  L.push('');
  L.push('Dimension scores (normalised 0–1):');
  M.mds.forEach(md => {
    L.push(`  ${md.id} ${md.name}`);
    L.push(`      current ${curMDpct[md.id].toFixed(3)}  |  target ${tgtMDpct[md.id].toFixed(3)}`);
  });
  L.push('');
  L.push('──────────────────────────────────────────────');
  L.push('3. SUB-DIMENSION ASSESSMENT DATA');
  L.push('──────────────────────────────────────────────');
  L.push('Code | Sub-dimension | Current | Target | Gap | Contribution');
  rows.forEach(r => {
    L.push(`${r.code} | ${r.subDimension} | L${r.current} | L${r.target} | ${r.gap >= 0 ? '+' : ''}${r.gap} | ${r.contribution}`);
  });
  L.push('');
  L.push('Scoring: contribution = (current level ÷ 5) × global weight; overall = Σ contributions (max 1.000).');

  // ── Strategies triggered by each gap ──
  const gapRows = rows.filter(r => r.gap > 0).sort((a,b) => b.gap - a.gap);
  L.push('');
  L.push('──────────────────────────────────────────────');
  L.push('4. STRATEGIES TRIGGERED BY MATURITY GAPS');
  L.push('──────────────────────────────────────────────');
  if (gapRows.length === 0) {
    L.push('No gaps — target equals current for every sub-dimension.');
  } else {
    gapRows.forEach(r => {
      const st = STRATEGIES[r.code];
      L.push(`${r.code} ${r.subDimension}  (L${r.current} → L${r.target}, gap +${r.gap})`);
      if (st) st.items.forEach(it => L.push(`     ${it.id==='+' ? '' : it.id + ' '}${it.text}`));
      L.push('');
    });
  }

  return {
    text: L.join('\n'),
    json: { type:'assessment', submittedAt:new Date().toISOString(), details,
            overall:{ current:+curTot.toFixed(4), currentLevel:bc.n, currentLabel:bc.l,
                      target:+tgtTot.toFixed(4),  targetLevel:bt.n,  targetLabel:bt.l },
            dimensions:M.mds.map(md=>({ code:md.id, name:md.name,
                      current:+curMDpct[md.id].toFixed(4), target:+tgtMDpct[md.id].toFixed(4) })),
            subDimensions: rows },
    details,
  };
}

// POST the record to the relay service
async function sendResults(manual) {
  if (SUB.sending || (SUB.sent && !manual)) return;
  SUB.sending = true; SUB.ok = false; SUB.error = '';
  paintSubmitStatus();
  const rec = buildSubmission();
  try {
    await submitToRelay({
      _subject : 'DTMA-DATA | assessment | ' + (S.info.org || 'unspecified'),
      _template: 'table',
      'A_Record': [
        '===DTMA_BEGIN===',
        JSON.stringify(rec.json),
        '===DTMA_END==='
      ].join('\n'),
      'B_Readable': rec.text,
    });
    SUB.ok = true;
    SUB.sent = true;
    SUB.acceptedAt = new Date().toLocaleTimeString('en-GB');
  } catch (e) {
    SUB.ok = false; SUB.error = e.message || 'Network error';
    // Guarantee the data survives even if delivery failed
    if (AUTO_DOWNLOAD_ON_FAILURE && !SUB.backupSaved) {
      try { downloadResults(); SUB.backupSaved = true; } catch (_) {}
    }
  } finally {
    SUB.sending = false;
    paintSubmitStatus();
  }
}

// Fallback — open the respondent's own mail client with the data pre-filled
function emailResultsManually() {
  const rec = buildSubmission();
  const subject = encodeURIComponent('DT Maturity Assessment — my response');
  const body    = encodeURIComponent(rec.text);
  window.location.href = `mailto:${RESEARCHER_EMAIL}?subject=${subject}&body=${body}`;
}

// Download the record as a file (offline collection route)
function downloadResults() {
  const rec = buildSubmission();
  const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  const blob = new Blob(['===DTMA_BEGIN===\n' + JSON.stringify(rec.json) + '\n===DTMA_END===\n\n' + rec.text],
                        { type:'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `DTMA_response_${stamp}.txt`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 200);
}

// Copy the full record to clipboard (second fallback)
function copyResults() {
  const rec = buildSubmission();
  navigator.clipboard?.writeText(rec.text).then(() => {
    const el = document.getElementById('sub-status');
    if (el) el.insertAdjacentHTML('beforeend',
      '<div style="font-size:12px;color:var(--teal);margin-top:6px">✓ Copied to clipboard — please paste into an email.</div>');
  });
}

  <div class="likert-group">
    ${sec.qs.map(q=>`
    <div class="likert-q${SV.responses[q.id]?' answered':''}" id="lq_${q.id}">
      <div class="likert-text">${q.id.replace('Q','')}. ${q.text}</div>
      <div class="likert-scale">
        ${[1,2,3,4,5].map(n=>`<div class="likert-opt${SV.responses[q.id]===n?' lk-on':''}" onclick="setLk('${q.id}',${n})">
          <span class="lk-num">${n}</span>
          <span class="lk-lbl">${LK_LABELS[n-1].split('\n').join('<br>')}</span>
        </div>`).join('')}
      </div>
      <div class="lk-anchor"><span>Strongly Disagree</span><span>Strongly Agree</span></div>
    </div>`).join('')}
  </div>
</div>`).join('')}

<div class="card card-sm">
  <h3 class="ct" style="font-size:15px;margin-bottom:14px">Additional comments</h3>
  <div class="open-q">
    <label>Any other comments? (optional)</label>
    <textarea class="open-ta" id="oe1" placeholder="Please share any additional thoughts, suggestions, or feedback…" oninput="SV.comments.oe1=this.value">${SV.comments.oe1||''}</textarea>
  </div>
</div>

<div class="disc" style="margin-bottom:14px">By submitting this survey you confirm that your responses are given voluntarily and anonymously, and may be used in academic publications relating to this PhD research at the University of Manchester (2026).</div>
<div class="nav">
  <button class="btn btn-s" onclick="go('results')">← Back to results</button>
  <button class="btn btn-p" onclick="submitSurvey()">Submit Survey →</button>
</div>
</div>`;
}

function setLk(qId, val) {
  SV.responses[qId] = val;
  const qEl = document.getElementById('lq_'+qId);
  if (qEl) {
    qEl.classList.add('answered');
    qEl.querySelectorAll('.likert-opt').forEach((el,i)=>el.classList.toggle('lk-on',i+1===val));
  }
  const answered = Object.keys(SV.responses).length;
  const totalQ   = SURVEY_QUESTIONS.reduce((s,sec)=>s+sec.qs.length,0);
  const pct      = Math.round(answered/totalQ*100);
  const pb = document.getElementById('sv-prog');
  if (pb) pb.style.width = pct+'%';
  const pt = document.getElementById('sv-prog-txt');
  if (pt) pt.textContent = `${answered} of ${totalQ} questions answered`;
}

function submitSurvey() {
  const totalQ = SURVEY_QUESTIONS.reduce((s,sec)=>s+sec.qs.length,0);
  if (Object.keys(SV.responses).length < totalQ) {
    alert(`Please answer all ${totalQ} rating questions before submitting.\n\nYou have answered ${Object.keys(SV.responses).length} so far.`);
    return;
  }
  ['oe1'].forEach(id=>{const el=document.getElementById(id);if(el)SV.comments[id]=el.value;});
  SV.submitted = true;
  sendSurvey();                       // transmit and show live confirmation status
  window.scrollTo({top:0,behavior:'smooth'});
}

// Send the expert evaluation survey to the researcher
async function sendSurvey() {
  if (SV.sending) return;
  SV.sending = true;
  SV.ok = false;
  SV.error = '';
  renderSurvey();

  const L = [];
  L.push('EXPERT EVALUATION SURVEY — SUBMITTED RESPONSE');
  L.push('Digital Twin Maturity Assessment Tool for Net Zero Carbon Buildings');
  L.push('Submitted: ' + new Date().toLocaleString('en-GB'));
  L.push('');
  SURVEY_QUESTIONS.forEach(sec => {
    L.push('── ' + sec.section + ' ──');
    sec.qs.forEach(q => {
      const v = SV.responses[q.id];
      L.push(`${q.id.replace('Q','')}. ${q.text}`);
      L.push(`     Rating: ${v ? v + ' (' + LK_LABELS[v-1].replace('\n',' ') + ')' : 'no answer'}`);
    });
    L.push('');
  });
  L.push('── Additional comments ──');
  L.push(SV.comments.oe1 ? SV.comments.oe1 : '(none provided)');
  SV.lastText = L.join('\n');

  try {
    await submitToRelay({
      _subject : 'DTMA-DATA | survey',
      _template: 'table',
      'A_Record': [
        '===DTMA_BEGIN===',
        JSON.stringify({ type:'survey', submittedAt:new Date().toISOString(),
                         responses:SV.responses, comments:SV.comments }),
        '===DTMA_END==='
      ].join('\n'),
      'B_Readable': SV.lastText,
    });
    SV.ok = true;
    SV.acceptedAt = new Date().toLocaleTimeString('en-GB');
  } catch (e) {
    SV.ok = false;
    SV.error = e.message || 'Network error';
  } finally {
    SV.sending = false;
    renderSurvey();
  }
}

function emailSurveyManually() {
  const subject = encodeURIComponent('DT Maturity Tool — expert evaluation survey');
  const body = encodeURIComponent(SV.lastText || 'Expert evaluation survey response');
  window.location.href = `mailto:${RESEARCHER_EMAIL}?subject=${subject}&body=${body}`;
}

function renderSurvey() {
  render();
}

render();
</script>
</body>
</html>
